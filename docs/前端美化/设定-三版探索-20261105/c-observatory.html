<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="studio.css"><title>关系观测台 · 小说工坊</title></head><body data-variant="C"><div class="backdrop" aria-hidden="true"></div><header class="topbar" id="topbar"></header><div class="mobile-bar" id="mobile-bar"></div><div class="workspace" id="workspace"><aside class="pane nav-pane" id="nav-pane" aria-label="设定目录"></aside><div class="divider" data-size="nav" role="separator" aria-label="调整目录宽度" aria-orientation="vertical" tabindex="0"></div><main class="pane main-pane observatory-pane" aria-label="关系图谱"><div class="page-head" id="main-head"></div><div class="graph-stage" id="graph-stage" tabindex="0" aria-label="拖动空白平移，滚轮缩放关系图"><div id="graph-content"><svg id="graph-edges" width="100%" height="100%" aria-hidden="true"></svg><div id="graph-nodes"></div></div><div class="graph-empty" hidden></div></div><footer class="graph-footer" id="main-foot"></footer></main><div class="divider" data-size="detail" role="separator" aria-label="调整条目详情宽度" aria-orientation="vertical" tabindex="0"></div><aside class="pane detail-pane" id="detail-pane" aria-label="选中条目详情"></aside></div><button class="scrim" aria-label="关闭侧栏" data-action="close-drawer"></button><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div><script src="prototype.js"></script></body></html>
