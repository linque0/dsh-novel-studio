<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大纲 · 设计对照</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#17151f;color:#f5effa;font:14px/1.8 "Microsoft YaHei",sans-serif}h1{font-size:23px;margin:0 0 8px}p{color:#cbbdd8}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,a{color:inherit;background:#30283d;border:1px solid #65546e;border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;font:inherit}button[aria-pressed=true]{background:#eee6f5;color:#27202f}img{width:100%;height:auto;display:block;border-radius:10px}#main{overflow:auto}#main.native img{width:auto;max-width:none}small{color:#bdafc9}.hint{max-width:1000px}h2{font-size:15px}</style><h1>大纲 · B 稿与正式界面对照</h1><p class="hint">1440 × 900，同一作品内容、选中事件与背景静帧。正式界面使用真实组件与数据接口；容器、统计和面包屑按实际层级显示。并排图左为原稿，右为正式界面。</p><nav><button type="button" data-name="07-side-by-side">并排对照</button><button type="button" data-name="05-overlay">50% 叠加</button><button type="button" data-name="06-difference">差异图</button><button type="button" data-name="02-actual-b-chrome">正式界面</button><button type="button" data-name="08-container-readable">容器 · 阅读</button><button type="button" data-name="03-container-overview">容器 · 总览</button><button type="button" data-name="04-a-collapse">侧栏收起</button><button type="button" data-name="compare-topbar">顶栏局部</button><button type="button" data-name="compare-sidebar">结构局部</button><button type="button" data-name="compare-heading">标题局部</button><button type="button" data-name="compare-card">纸卡局部</button><button type="button" data-name="compare-detail">详情局部</button><button type="button" data-name="verified-outline-1280">1280px</button><button type="button" data-name="verified-outline-760-canvas">760px</button><button type="button" data-name="verified-outline-380-canvas">380px</button><button type="button" data-name="verified-panel-outline-1440">独立窗口</button><button type="button" id="native">原尺寸 / 适应</button></nav><h2 id="caption">并排对照</h2><div id="main"><img id="shot" alt="B 设计稿与正式界面的对照截图" src="screenshots/07-side-by-side.png"></div><p class="hint"><small>固定三栏位置、字体、顶栏和详情纵向节奏见 comparison-report.json。底部创建栏向左移 17.5px 以消除原稿与缩放栏的交叠；跨层提示单独占行，画布留出底部工具安全区。总览供全书定位，100% 或进入容器可恢复阅读。测试环境、剩余差异与验收记录见 README.md。</small></p><script>document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{document.querySelector('#shot').src='screenshots/'+b.dataset.name+'.png';document.querySelector('#caption').textContent=b.textContent;document.querySelectorAll('[data-name]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)))});document.querySelector('#native').onclick=()=>document.querySelector('#main').classList.toggle('native')</script></html>
